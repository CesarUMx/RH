# Configuración de Nginx para el sistema RH
# Copiar a: /etc/nginx/sites-available/rh
# Activar con: sudo ln -s /etc/nginx/sites-available/rh /etc/nginx/sites-enabled/
# Probar con: sudo nginx -t
# Recargar con: sudo systemctl reload nginx

# Upstream para el backend
upstream rh_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Upstream para el frontend
upstream rh_frontend {
    server 127.0.0.1:4173;
    keepalive 64;
}

server {
    server_name rh.mondragonmexico.edu.mx;
    
    # Logs
    access_log /var/log/nginx/rh-access.log;
    error_log /var/log/nginx/rh-error.log;
    
    # Seguridad básica
    client_max_body_size 10M;
    
    # Proxy para archivos estáticos (uploads) - IMPORTANTE: debe ir ANTES de /api/
    location /uploads/ {
        proxy_pass http://rh_backend;
        proxy_http_version 1.1;
        
        # Headers para proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache para archivos estáticos
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Proxy para el backend (API)
    location /api/ {
        proxy_pass http://rh_backend;
        proxy_http_version 1.1;
        
        # Headers para proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para el frontend (React/Vite)
    location / {
        proxy_pass http://rh_frontend;
        proxy_http_version 1.1;
        
        # Headers para proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rh.mondragonmexico.edu.mx/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rh.mondragonmexico.edu.mx/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirección HTTP a HTTPS
server {
    if ($host = rh.mondragonmexico.edu.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name rh.mondragonmexico.edu.mx;
    return 404; # managed by Certbot
}
